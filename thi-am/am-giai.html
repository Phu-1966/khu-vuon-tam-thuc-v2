<poem aria-label="Bài thơ Âm Giai">
<div class="stanza">Dù tiết hạ hay đông
Dù trời mưa hay nắng
Ta làm một cây phong
Lặng thưởng những giai âm</div>
<div class="stanza">Trẻ trung vui buồn tẻ nhạt
Và bản năng lý trí
Chẳng ai nói với ta
Phải thế này thế nọ
Ta bỏ mặc thời gian
Gã đồng hành lặng lẽ
Để dệt những âm giai
Và gửi vào trong gió
Em là mùa thu
đến thay áo cho ta</div>
</poem>
