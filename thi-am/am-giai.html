<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9eee8">
<title>ÂM GIAI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e9eee8;color:#34443b;font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;align-items:center;padding:34px 20px}.page{width:min(100%,680px);padding:48px 24px 54px;text-align:center}h1{font-weight:400;letter-spacing:.16em;font-size:1.3rem;margin:0 0 46px;color:#46594d}.poem{font-size:1.2rem;line-height:2.05;white-space:pre-line;letter-spacing:.015em}.poem p{margin:0 0 1.25em}@media(max-width:480px){.page{padding:32px 10px}.poem{font-size:1.08rem;line-height:1.95}h1{margin-bottom:36px}}
</style>
</head>
<body>
<main class="page">
<h1>ÂM GIAI</h1>
<div class="poem">
<p>Dù tiết hạ hay đông
Dù trời mưa hay nắng
Ta làm một cây phong
Lặng thưởng những giai âm 
Trẻ trung vui buồn tẻ nhạt
Và bản năng lý trí
Chẳng ai nói với ta 
Phải thế này thế nọ
Ta bỏ mặc thời gian
Gã đồng hành lặng lẽ
Để dệt những âm giai 
Và gửi vào trong gió
Em là mùa thu 
đến thay áo cho ta</p>
</div>
</main>
</body>
</html>
