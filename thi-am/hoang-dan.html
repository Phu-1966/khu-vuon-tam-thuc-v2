<poem aria-label="Bài thơ Hoàng Đàn">
<div class="stanza">Và trong đêm
vẫn ngọn gió thay mùa
Cây hoàng đàn nhà bên
vặn mình rích rắc
Từng mảnh giáp liệng bay
và trên cát
Những chiếc lá
khô lay</div>

  if(gardenAudio.paused){
    try{await gardenAudio.play();gardenButton.textContent='🍃 Khu vườn đang mở';gardenButton.classList.add('active');}
    catch(e){gardenButton.textContent='🍃 Khu vườn';}
  }else{gardenAudio.pause();gardenAudio.currentTime=0;gardenButton.textContent='🍃 Khu vườn';gardenButton.classList.remove('active');}
});
